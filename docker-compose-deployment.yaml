version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uav_postgres
    restart: always
    env_file:
      - docker/.env
    environment:
      POSTGRES_USER: ${PGROLE}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: uav_app
    restart: always
    env_file:
      - docker/.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data:
