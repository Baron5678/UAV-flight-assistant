[alembic]
script_location = /app/alembic
prepend_sys_path = /app

sqlalchemy.url = postgresql+psycopg://diploma:zxc12345@postgres:5432/uav_data_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
