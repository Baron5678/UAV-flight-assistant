# UAV Flight Assistant Configuration

# Flight Control Settings
flight_control:
  max_altitude: 120.0  # meters
  max_speed: 15.0  # m/s
  default_takeoff_altitude: 10.0  # meters
  landing_speed: 1.0  # m/s

# Safety Settings
safety:
  min_battery_voltage: 10.5  # volts
  critical_battery_percentage: 20.0  # %
  warning_battery_percentage: 30.0  # %
  max_altitude: 120.0  # meters (AGL)
  min_gps_satellites: 6
  geofence_enabled: true
  geofence_radius: 1000.0  # meters

# Navigation Settings
navigation:
  waypoint_acceptance_radius: 2.0  # meters
  default_waypoint_speed: 5.0  # m/s
  use_gps: true
  use_barometer: true

# Communication Settings
communication:
  telemetry_interval: 1.0  # seconds
  connection_timeout: 10.0  # seconds
  retry_attempts: 3
  port: 5760
  baudrate: 57600

# Sensor Settings
sensors:
  imu_sample_rate: 100  # Hz
  gps_sample_rate: 10  # Hz
  barometer_sample_rate: 20  # Hz
  battery_check_interval: 5.0  # seconds

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_to_file: true
  log_directory: "logs"
  max_log_size: 10485760  # bytes (10 MB)
  backup_count: 5
